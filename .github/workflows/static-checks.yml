name: Project static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Blender Python script syntax
        run: python -m py_compile Tools/blender/create_arin_blockout.py

      - name: Validate campaign quest and integration-guide consistency
        run: python Tools/validate_campaign.py

      - name: Validate quest delegate re-entry safeguards
        run: python Tools/validate_quest_notifications.py

      - name: Validate shop transaction rollback safeguards
        run: python Tools/validate_shop.py

      - name: Validate save-slot snapshot safeguards
        run: python Tools/validate_save_snapshot.py

      - name: Validate campaign save-load safeguards
        run: python Tools/validate_campaign_load.py

      - name: Validate character input and consumable safeguards
        run: python Tools/validate_character_safety.py

      - name: Validate Chapter 1 Unreal Editor level generator
        run: python Tools/validate_chapter01_level_generator.py

      - name: Validate Chapter 2 Unreal Editor level generator
        run: python Tools/validate_chapter02_level_generator.py

      - name: Validate Chapter 3 Unreal Editor level generator
        run: python Tools/validate_chapter03_level_generator.py

      - name: Validate Chapter 4 Unreal Editor level generator
        run: python Tools/validate_chapter04_level_generator.py

      - name: Validate Chapter 5 Unreal Editor level generator
        run: python Tools/validate_chapter05_level_generator.py

      - name: Validate Chapter 6 Unreal Editor level generator
        run: python Tools/validate_chapter06_level_generator.py

      - name: Validate Chapter 7 Unreal Editor level generator
        run: python Tools/validate_chapter07_level_generator.py

      - name: Validate Chapter 8 Unreal Editor level generator
        run: python Tools/validate_chapter08_level_generator.py

      - name: Validate Chapter 9 Unreal Editor level generator
        run: python Tools/validate_chapter09_level_generator.py

      - name: Validate Chapter 10 Unreal Editor level generator
        run: python Tools/validate_chapter10_level_generator.py

      - name: Validate Chapter 11 Unreal Editor level generator
        run: python Tools/validate_chapter11_level_generator.py

      - name: Validate Chapter 12 Unreal Editor level generator
        run: python Tools/validate_chapter12_level_generator.py

      - name: Validate Chapter 13 Unreal Editor level generator
        run: python Tools/validate_chapter13_level_generator.py

      - name: Validate Chapter 14 Unreal Editor level generator
        run: python Tools/validate_chapter14_level_generator.py

      - name: Validate Chapter 15 Unreal Editor level generator
        run: python Tools/validate_chapter15_level_generator.py

      - name: Validate Chapter 16 Unreal Editor level generator
        run: python Tools/validate_chapter16_level_generator.py

      - name: Validate quest trigger interaction and cleanup
        run: python Tools/validate_quest_trigger_interaction.py

      - name: Validate Unreal breach arena greybox
        run: python Tools/validate_arena_greybox.py

      - name: Validate Unreal monster blockout
        run: python Tools/validate_monster_blockout.py

      - name: Validate breach and boss encounter integration
        run: python Tools/validate_encounters.py

      - name: Validate Unreal boss foundation
        run: python Tools/validate_boss_foundation.py

      - name: Validate Arin blockout and Unreal input bindings
        run: python Tools/validate_playable_foundation.py

      - name: Validate swept melee weapon tracing
        run: python Tools/validate_weapon_trace.py

      - name: Validate health component finite-value safeguards
        run: python Tools/validate_health_component.py

      - name: Validate monster damage finite-value safeguards
        run: python Tools/validate_monster_damage.py

      - name: Validate ability energy and tuning safeguards
        run: python Tools/validate_ability_component.py

      - name: Validate player damage intake safeguards
        run: python Tools/validate_player_damage.py

      - name: Validate equipment metadata and combat-stat safeguards
        run: python Tools/validate_equipment_safety.py

      - name: Validate Arin movement and combat tuning
        run: python Tools/validate_arin_tuning.py

      - name: Validate checkpoint and chapter-exit trigger safety
        run: python Tools/validate_world_trigger_safety.py

      - name: Validate pickup duplicate-claim safeguards
        run: python Tools/validate_pickup_claim.py

      - name: Validate Chapter 1 objective-to-completion flow
        run: python Tools/validate_chapter_one_flow.py

      - name: Validate browser demo features and JavaScript syntax
        run: python Tools/validate_browser_demo.py

      - name: Validate Unreal project descriptor
        run: python -c "import json; json.load(open('HunterGame.uproject', encoding='utf-8'))"
