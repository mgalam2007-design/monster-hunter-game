name: Project static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Blender Python script syntax
        run: python -m py_compile Tools/blender/create_arin_blockout.py

      - name: Validate campaign quest and integration-guide consistency
        run: python Tools/validate_campaign.py

      - name: Validate quest delegate re-entry safeguards
        run: python Tools/validate_quest_notifications.py

      - name: Validate shop transaction rollback safeguards
        run: python Tools/validate_shop.py

      - name: Validate save-slot snapshot safeguards
        run: python Tools/validate_save_snapshot.py

      - name: Validate character input and consumable safeguards
        run: python Tools/validate_character_safety.py

      - name: Validate Unreal breach arena greybox
        run: python Tools/validate_arena_greybox.py

      - name: Validate Unreal monster blockout
        run: python Tools/validate_monster_blockout.py

      - name: Validate breach and boss encounter integration
        run: python Tools/validate_encounters.py

      - name: Validate Unreal boss foundation
        run: python Tools/validate_boss_foundation.py

      - name: Validate Arin blockout and Unreal input bindings
        run: python Tools/validate_playable_foundation.py

      - name: Validate swept melee weapon tracing
        run: python Tools/validate_weapon_trace.py

      - name: Validate health component finite-value safeguards
        run: python Tools/validate_health_component.py

      - name: Validate browser demo features and JavaScript syntax
        run: python Tools/validate_browser_demo.py

      - name: Validate Unreal project descriptor
        run: python -c "import json; json.load(open('HunterGame.uproject', encoding='utf-8'))"
