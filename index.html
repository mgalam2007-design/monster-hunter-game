<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Monster Hunter: Shadow Gate</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#070914;color:#eaf6ff;font-family:Arial,sans-serif}canvas{display:block}#hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap;text-shadow:0 2px 8px #000} .panel{background:#0b1020d9;border:1px solid #49d9ff66;border-radius:10px;padding:9px 12px;box-shadow:0 0 18px #00bfff22}.bar{height:8px;width:150px;background:#301a2b;border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff315c,#ff9b68)}#help{position:fixed;bottom:12px;left:12px;background:#0b1020d9;border:1px solid #49d9ff55;border-radius:10px;padding:10px;font-size:12px;line-height:1.6;max-width:270px}#center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}#message{background:#080d1de8;border:1px solid #54dfff88;border-radius:16px;padding:22px 28px;max-width:90vw;box-shadow:0 0 40px #00bfff33}button{pointer-events:auto;background:#11bde2;color:#04101a;border:0;border-radius:8px;padding:10px 18px;font-weight:bold;margin-top:12px}#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}#cross:before,#cross:after{content:"";position:absolute;background:#a8f4ff;box-shadow:0 0 8px #00d9ff}#cross:before{width:2px;height:18px;left:8px}#cross:after{height:2px;width:18px;top:8px}#mobile{display:none;position:fixed;right:12px;bottom:18px;gap:8px}#mobile button{margin:0;padding:15px;border-radius:50%;width:62px;height:62px}@media(max-width:700px){#help{font-size:10px;max-width:190px}#mobile{display:flex} .bar{width:100px}}
</style></head><body>
<div id="hud"><div class="panel">HUNTER HP <div class="bar"><i id="hpbar"></i></div><small id="hptext">100 / 100</small></div><div class="panel">LEVEL <b id="level">1</b> / 200<br>MONSTERS <b id="left">0</b></div><div class="panel">MANA COINS <b id="coins">0</b><br>KILLS <b id="kills">0</b></div></div>
<div id="help"><b>HUNTER CONTROLS</b><br>WASD / arrows: move · Mouse: aim<br>Left click: fire · Space: dash<br>Q: mana burst · P: pause<br>Clear the wave to advance.</div><div id="cross"></div><div id="center"><div id="message"><h1>SHADOW GATE</h1><p>Enter the dungeon. Hunt the monsters. Become stronger.</p><button id="start">ENTER DUNGEON</button></div></div><div id="mobile"><button id="fire">FIRE</button><button id="dash">DASH</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id);if(!window.THREE){$('message').innerHTML='<h2>3D engine could not load</h2><p>Check your internet connection and refresh.</p>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e8);scene.fog=new THREE.Fog(0xa8c9d8,32,105);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8edff,0x62513a,2));const key=new THREE.DirectionalLight(0xffedcf,2.4);key.position.set(8,18,5);key.castShadow=true;scene.add(key);
const glow=new THREE.PointLight(0xffd18a,1.2,35);glow.position.set(0,5,-12);scene.add(glow);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshStandardMaterial({color:0xb99a65,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.12;floor.receiveShadow=true;scene.add(floor);
for(let i=0;i<100;i++){let peb=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.3),new THREE.MeshStandardMaterial({color:[0x74654c,0x9d875f,0x514b3e][i%3],roughness:1}));peb.position.set((Math.random()-.5)*65,.02,(Math.random()-.5)*70);scene.add(peb)}
for(let i=0;i<18;i++){let side=i%2?1:-1;let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2.5+Math.random()*3,1),new THREE.MeshStandardMaterial({color:0x625d52,roughness:1}));rock.position.set(side*(15+Math.random()*7),2,-32+i*4);rock.scale.y=1.5;scene.add(rock)}
for(let i=0;i<20;i++){let x=(Math.random()-.5)*42,z=-28+Math.random()*48;if(Math.abs(x)<9)x+=x<0?-10:10;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.28,2.5,7),new THREE.MeshStandardMaterial({color:0x59432d}));trunk.position.set(x,1.25,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.5+Math.random(),8,7),new THREE.MeshStandardMaterial({color:0x405b37,roughness:1}));crown.position.set(x,3,z);crown.scale.y=1.3;scene.add(crown)}
function crystal(x,y,z,s,c){let m=new THREE.Mesh(new THREE.OctahedronGeometry(s),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.4,metalness:.3,roughness:.25}));m.position.set(x,y,z);m.rotation.z=.2;scene.add(m);return m}
for(let i=0;i<22;i++){let a=i/22*Math.PI*2,r=20+Math.random()*8;let p=crystal(Math.cos(a)*r,1+Math.random()*2,Math.sin(a)*r,.6+Math.random(),i%2?0x14cfff:0x873cff);p.userData.float=Math.random()*6}
const portal=new THREE.Mesh(new THREE.TorusGeometry(3,.22,12,64),new THREE.MeshStandardMaterial({color:0x37dfff,emissive:0x164cff,emissiveIntensity:3}));portal.position.set(0,4,-22);scene.add(portal);
for(let i=0;i<12;i++){let b=new THREE.Mesh(new THREE.BoxGeometry(2,5+Math.random()*5,2),new THREE.MeshStandardMaterial({color:0x24283d,roughness:.8}));let a=i/12*Math.PI*2;b.position.set(Math.cos(a)*25,2.5,Math.sin(a)*25);scene.add(b)}
const player=new THREE.Group();const armor=new THREE.MeshStandardMaterial({color:0x343b3b,metalness:.45,roughness:.7});const leather=new THREE.MeshStandardMaterial({color:0x59452f,roughness:1});const body=new THREE.Mesh(new THREE.CylinderGeometry(.34,.48,.95,10),armor);body.position.y=1.15;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),new THREE.MeshStandardMaterial({color:0xb28a65}));head.position.y=1.85;player.add(head);const hood=new THREE.Mesh(new THREE.ConeGeometry(.32,.48,8),leather);hood.position.y=2.08;player.add(hood);for(let s of [-1,1]){let arm=new THREE.Mesh(new THREE.CylinderGeometry(.13,.18,.8,8),armor);arm.position.set(s*.48,1.2,0);arm.rotation.z=s*.25;player.add(arm);let leg=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.8,8),leather);leg.position.set(s*.2,.42,0);player.add(leg)}const cape=new THREE.Mesh(new THREE.ConeGeometry(.58,1.15,8),leather);cape.position.set(0,.95,.36);cape.rotation.x=.2;player.add(cape);scene.add(player);player.position.set(0,0,8);
const bullets=[],enemies=[],particles=[];let hp=100,coins=0,kills=0,level=1,running=false,paused=false,last=0,spawned=0,total=5,fireCooldown=0;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();dash()}if(e.key.toLowerCase()==='q')burst();if(e.key.toLowerCase()==='p')togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let yaw=0,pitch=0,mouseDown=false;renderer.domElement.addEventListener('click',()=>{if(running)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=Math.max(-.6,Math.min(.6,pitch-e.movementY*.002))}});document.addEventListener('mousedown',e=>{if(e.button===0)mouseDown=true});document.addEventListener('mouseup',()=>mouseDown=false);
function makeEnemy(){let type='troll',g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0x625d50,roughness:1,metalness:.08});let torso=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,2),mat);torso.scale.set(1.05,1.3,.72);torso.position.y=1.75;g.add(torso);let chest=new THREE.Mesh(new THREE.IcosahedronGeometry(.85,1),new THREE.MeshStandardMaterial({color:0x82765f,roughness:1}));chest.scale.set(1,.9,.7);chest.position.set(0,1.35,.35);g.add(chest);let head=new THREE.Mesh(new THREE.DodecahedronGeometry(.68,2),mat);head.position.set(0,2.85,.08);g.add(head);let jaw=new THREE.Mesh(new THREE.BoxGeometry(.62,.35,.48),new THREE.MeshStandardMaterial({color:0x3d342b}));jaw.position.set(0,2.48,.48);g.add(jaw);for(let s of [-1,1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.095,10,8),new THREE.MeshBasicMaterial({color:0xffc46a}));eye.position.set(s*.25,2.9,.64);g.add(eye);let horn=new THREE.Mesh(new THREE.ConeGeometry(.17,.75,6),mat);horn.position.set(s*.52,3.25,.05);horn.rotation.z=s*.65;g.add(horn);let arm=new THREE.Mesh(new THREE.CylinderGeometry(.28,.42,1.65,9),mat);arm.position.set(s*1.12,1.35,.05);arm.rotation.z=s*.18;g.add(arm);let fist=new THREE.Mesh(new THREE.DodecahedronGeometry(.43,1),mat);fist.position.set(s*1.18,.48,.15);g.add(fist);let leg=new THREE.Mesh(new THREE.CylinderGeometry(.28,.36,1.15,8),mat);leg.position.set(s*.48,.48,0);g.add(leg)}for(let i=0;i<12;i++){let spike=new THREE.Mesh(new THREE.ConeGeometry(.16,.45,5),mat);spike.position.set((Math.random()-.5)*1.5,2.55+Math.random()*.6,-.35);spike.rotation.x=-.7;g.add(spike)}const hpMax=level*2+3;const hpBack=new THREE.Mesh(new THREE.PlaneGeometry(1.35,.16),new THREE.MeshBasicMaterial({color:0x260b18,depthTest:false}));hpBack.position.set(0,3.75,.62);hpBack.renderOrder=10;g.add(hpBack);const hpFill=new THREE.Mesh(new THREE.PlaneGeometry(1.25,.09),new THREE.MeshBasicMaterial({color:0x35ef75,depthTest:false}));hpFill.position.set(0,3.75,.64);hpFill.renderOrder=11;g.add(hpFill);g.position.set((Math.random()-.5)*12,0,-12-Math.random()*12);g.userData={hp:hpMax,hpMax,speed:1.1+level*.025,phase:Math.random()*5,type,hpFill};scene.add(g);enemies.push(g)}
function burst(){if(!running||coins<10)return;coins-=10;$('coins').textContent=coins;for(let e of [...enemies])if(e.position.distanceTo(player.position)<8)damage(e,5)}
function dash(){if(!running)return;player.position.x-=Math.sin(yaw)*2.5;player.position.z-=Math.cos(yaw)*2.5}
function damage(e,n){e.userData.hp-=n;if(e.userData.hpFill){const ratio=Math.max(0,e.userData.hp/e.userData.hpMax);e.userData.hpFill.scale.x=ratio;e.userData.hpFill.position.x=-.625*(1-ratio);e.userData.hpFill.material.color.set(ratio>.5?0x35ef75:ratio>.25?0xffc247:0xff315c)}for(let i=0;i<5;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.07),new THREE.MeshBasicMaterial({color:0x34dfff}));p.position.copy(e.position).add(new THREE.Vector3((Math.random()-.5),1+Math.random(),(Math.random()-.5)));p.userData.life=.5;scene.add(p);particles.push(p)}if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;coins+=5;$('kills').textContent=kills;$('coins').textContent=coins}}
function shoot(){let dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));let b=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0x9df7ff}));b.position.copy(player.position).add(new THREE.Vector3(0,1.3,0));b.userData={v:dir.multiplyScalar(32),life:1.4};scene.add(b);bullets.push(b)}
function wave(){total=Math.min(5+level*2,35);spawned=0}
function togglePause(){if(!running)return;paused=!paused;$('message').style.display=paused?'grid':'none';if(paused)$('message').innerHTML='<h2>PAUSED</h2><button id="resume">RESUME</button>';$('resume')?.addEventListener('click',togglePause)}
$('start').onclick=()=>{running=true;$('center').style.display='none';wave();last=performance.now();renderer.domElement.focus()};
$('fire').onclick=shoot;$('dash').onclick=dash;
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.04);last=t;if(!paused){portal.rotation.z+=dt*.5;glow.intensity=2.5+Math.sin(t*.002)*.8;for(const o of scene.children)if(o.userData.float!==undefined){o.position.y=1.5+Math.sin(t*.001+o.userData.float)*.5;o.rotation.y+=dt*.5}
if(running){let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);player.position.x+=(Math.cos(yaw)*s+Math.sin(yaw)*f)*8*dt;player.position.z+=(Math.sin(yaw)*s-Math.cos(yaw)*f)*8*dt;player.position.x=Math.max(-18,Math.min(18,player.position.x));player.position.z=Math.max(-18,Math.min(18,player.position.z));player.rotation.y=yaw;camera.position.lerp(new THREE.Vector3(player.position.x+Math.sin(yaw)*6,player.position.y+4.2,player.position.z+Math.cos(yaw)*7),.08);camera.lookAt(player.position.x,1.5,player.position.z-3);if(mouseDown&&t-fireCooldown>180){shoot();fireCooldown=t}
if(spawned<total&&enemies.length<Math.min(5+level,12)&&Math.random()<dt*1.8){makeEnemy();spawned++}
for(let e of [...enemies]){let d=new THREE.Vector3(player.position.x-e.position.x,0,player.position.z-e.position.z);let dist=d.length();if(dist>1.5){d.normalize();e.position.addScaledVector(d,e.userData.speed*dt)}else{hp-=8*dt;$('hpbar').style.width=Math.max(0,hp)+'%';$('hptext').textContent=Math.ceil(hp)+' / 100';if(hp<=0){running=false;$('center').style.display='grid';$('message').innerHTML='<h1>HUNTER DOWN</h1><p>Level reached: '+level+'</p><button onclick="location.reload()">TRY AGAIN</button>'}}e.position.y=0;e.rotation.y+=dt*.8}
for(let b of [...bullets]){b.position.addScaledVector(b.userData.v,dt);b.userData.life-=dt;let hit=enemies.find(e=>e.position.distanceTo(b.position)<1.2);if(hit){damage(hit,2);scene.remove(b);bullets.splice(bullets.indexOf(b),1)}else if(b.userData.life<=0){scene.remove(b);bullets.splice(bullets.indexOf(b),1)}}
for(let p of [...particles]){p.userData.life-=dt;p.position.y+=dt*2;if(p.userData.life<=0){scene.remove(p);particles.splice(particles.indexOf(p),1)}}
$('left').textContent=enemies.length+(total-spawned);if(spawned===total&&enemies.length===0){level=Math.min(200,level+1);coins+=20;hp=Math.min(100,hp+15);$('level').textContent=level;$('coins').textContent=coins;$('hpbar').style.width=hp+'%';wave()}
}}
renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});})();
</script></body></html>
